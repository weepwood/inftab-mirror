name: Focused PWA validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build-pwa.mjs'
      - 'scripts/pwa-*'
      - 'e2e/pwa-offline.spec.ts'
      - 'e2e/pwa-update.spec.ts'
      - 'playwright.config.ts'
      - '.github/workflows/pwa-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: focused-pwa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pwa-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:production:built -- e2e/pwa-offline.spec.ts e2e/pwa-update.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: focused-pwa-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
