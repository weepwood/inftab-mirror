name: Focused PWA validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build-pwa.mjs'
      - 'scripts/pwa-*'
      - 'scripts/check-pwa-build.mjs'
      - 'package.json'
      - '.github/workflows/deploy-pages.yml'
      - 'playwright.production.config.ts'
      - 'e2e/pwa-offline.spec.ts'
      - 'e2e/pwa-update.spec.ts'
      - 'playwright.config.ts'
      - 'playwright.stable.config.ts'
      - 'e2e-extension/new-tab.spec.ts'
      - 'scripts/check-bundle-size.mjs'
      - '.github/workflows/pwa-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: focused-pwa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pwa-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build production fixtures
        id: build
        run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:production:built -- e2e/pwa-offline.spec.ts e2e/pwa-update.spec.ts
      - run: npm run test:e2e:extension:built
      - name: Enforce unchanged bundle budgets
        if: steps.build.outcome == 'success' && !cancelled()
        run: node scripts/check-bundle-size.mjs && node scripts/check-pwa-build.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: focused-pwa-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
