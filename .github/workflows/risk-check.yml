name: Focused UI validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/App.vue'
      - 'src/desktop/**'
      - 'e2e/desktop-alpha.spec.ts'
      - 'e2e/desktop-alpha2.spec.ts'
      - 'src/components/SearchBar.vue'
      - 'src/components/HomeDock.vue'
      - 'vite.config.ts'
      - 'src/data/browserApiShared.ts'
      - 'src/data/browser*.ts'
      - 'src/composables/overlayFocus.ts'
      - 'src/composables/useHomeNavigation.ts'
      - 'src/composables/useShortcutDrag.ts'
      - 'e2e/appearance.spec.ts'
      - 'e2e/new-tab.spec.ts'
      - 'src/components/CommandPalette.vue'
      - 'src/components/ShortcutGrid.vue'
      - 'src/composables/useShortcutParticles.ts'
      - 'src/data/launcherSearch.ts'
      - 'scripts/benchmark-launcher*'
      - 'src/styles/tokens.css'
      - 'src/composables/concurrentState.ts'
      - 'src/styles/main.css'
      - 'src/data/customTheme.ts'
      - 'src/data/themeExchange.ts'
      - 'src/components/CustomThemeEditor.vue'
      - 'e2e/custom-theme.spec.ts'
      - 'src/components/SettingsPanel.vue'
      - 'src/components/SelectField.vue'
      - 'src/components/HomeWorkspaceTabs.vue'
      - 'e2e/workspace-switcher.spec.ts'
      - 'e2e/ui-refinements.spec.ts'
      - 'e2e/visual-system.spec.ts'
      - '.github/workflows/risk-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: focused-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Launcher performance diagnostics
        run: npm run benchmark:launcher
      - name: Install only Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify overlay and visual contracts
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-ui-report
        run: npm run test:e2e -- --output=test-results-ui e2e/visual-system.spec.ts e2e/accessibility.spec.ts e2e/ui-refinements.spec.ts e2e/workspace-switcher.spec.ts e2e/custom-theme.spec.ts e2e/desktop-alpha.spec.ts e2e/desktop-alpha2.spec.ts
      - name: Verify release regression cases
        run: npm run test:e2e -- e2e/appearance.spec.ts e2e/new-tab.spec.ts --grep 'tall calendar presets|every built-in panel route|touch scrolling over shortcuts'
      - name: Save UI report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-ui-report
          path: |
            playwright-ui-report/
            test-results-ui/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
