name: Focused data validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/data/bookmarkHtml.ts'
      - 'src/data/folderTree.ts'
      - 'src/data/backupHistory.ts'
      - 'src/data/shortcutBatch.ts'
      - 'src/data/workspaceLayout.ts'
      - 'src/desktop/ownership.ts'
      - 'src/desktop/desktopOperations.ts'
      - 'src/desktop/transactionIntent.ts'
      - 'src/desktop/operationHistory.ts'
      - 'e2e/desktop-storage.spec.ts'
      - 'src/data/workspaceOwnership.ts'
      - 'src/data/shortcutTags.ts'
      - 'src/composables/workspaceBackup.ts'
      - 'src/composables/workspaceSnapshot.ts'
      - 'src/composables/useStoredState.ts'
      - 'src/composables/useLocalWorkspace.ts'
      - 'src/data/storageAdapter.ts'
      - 'src/data/workspaceJournal.ts'
      - 'src/data/workspaceGeneration.ts'
      - 'src/data/workspaceAuthority.ts'
      - 'src/data/workspaceTransfer.ts'
      - 'src/migrationConsole.ts'
      - 'src/authorityEditor.ts'
      - 'src/data/authoritySession.ts'
      - 'migration/**'
      - 'vite.migration.config.ts'
      - 'e2e/workspace-authority.spec.ts'
      - 'src/data/snapshotStore.ts'
      - 'src/data/workspaceConflict.ts'
      - 'src/data/rehearsalDraft.ts'
      - 'src/data/workspaceConflict.test.ts'
      - 'e2e/workspace-generation.spec.ts'
      - 'src/data/storagePreflight.ts'
      - 'src/components/StoragePreflight.vue'
      - 'e2e/storage-preflight.spec.ts'
      - 'e2e/workspace-journal.spec.ts'
      - 'src/components/ShortcutManager.vue'
      - 'src/data/layoutEditor.ts'
      - 'src/data/configMigration.ts'
      - 'src/components/ConfigMigration.vue'
      - 'e2e/config-migration.spec.ts'
      - 'src/components/HomeLayoutEditor.vue'
      - 'e2e/layout-editor.spec.ts'
      - 'e2e/data-management.spec.ts'
      - '.github/workflows/data-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: focused-data-${{ github.ref }}
  cancel-in-progress: true
jobs:
  data-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:migration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- e2e/data-management.spec.ts e2e/layout-editor.spec.ts e2e/config-migration.spec.ts e2e/workspace-journal.spec.ts e2e/desktop-storage.spec.ts e2e/storage-preflight.spec.ts e2e/workspace-generation.spec.ts e2e/workspace-authority.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: focused-data-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
