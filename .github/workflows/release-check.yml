name: Release validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'docs/releases/v*.*.0.md'
  push:
    branches: [main]
    paths:
      - 'docs/releases/v*.*.0.md'
    tags:
      - 'v*.*.0'

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: release-verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check types, run regression tests and build once
        run: npm run verify
      - name: Build and validate web-only offline assets
        run: node scripts/build-pwa.mjs && node scripts/check-pwa-build.mjs
      - name: Install Chromium and stable Chrome and Edge
        run: npx playwright install --with-deps chromium chrome msedge
      - name: Run browser end-to-end tests
        run: npm run test:e2e
      - name: Verify stable Chrome and Edge websites
        run: npm run test:e2e:stable:built
      - name: Test the production preview
        run: npm run test:e2e:production:built
      - name: Load and test the packaged browser extension
        run: npm run test:e2e:extension:built
      - name: Save browser test report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Save verified release build
        uses: actions/upload-artifact@v4
        with:
          name: verified-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Save verified website build
        uses: actions/upload-artifact@v4
        with:
          name: verified-web-${{ github.sha }}
          path: dist-web/
          if-no-files-found: error
          retention-days: 14

  publish-v20:
    name: Publish validated V2.0.0
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Check release identity
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$version" != '2.0.0' ] || [ ! -f docs/releases/v2.0.0.md ]; then exit 0; fi
          if existing="$(gh release view v2.0.0 --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$existing" = true ]; then echo 'Existing draft requires explicit recovery; refusing overwrite' >&2; exit 1; fi
            echo 'V2.0.0 already published; no overwrite'; exit 0
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v2.0.0" >/dev/null 2>&1; then
            echo 'Existing tag without release; refusing to overwrite' >&2; exit 1
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.publish == 'true'
        with:
          name: verified-dist-${{ github.sha }}
          path: release-extension
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.publish == 'true'
        with:
          name: verified-web-${{ github.sha }}
          path: release-web
      - name: Package only verified artifacts and publish
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f release-extension/manifest.json
          test -f release-web/sw.js
          test ! -f release-extension/sw.js
          test ! -f release-web/manifest.json
          (cd release-extension && zip -qr ../inftab-v2.0.0-extension.zip .)
          (cd release-web && zip -qr ../inftab-v2.0.0-web.zip .)
          sha256sum inftab-v2.0.0-*.zip > SHA256SUMS.txt
          unzip -tq inftab-v2.0.0-extension.zip
          unzip -tq inftab-v2.0.0-web.zip
          test "$(node -p "require('./release-extension/manifest.json').version")" = '2.0.0'
          gh release create v2.0.0 --draft --target "$GITHUB_SHA" --title 'Inftab V2.0.0' --notes-file docs/releases/v2.0.0.md inftab-v2.0.0-extension.zip inftab-v2.0.0-web.zip SHA256SUMS.txt
          mkdir downloaded-release
          gh release download v2.0.0 --dir downloaded-release
          cmp SHA256SUMS.txt downloaded-release/SHA256SUMS.txt
          (cd downloaded-release && sha256sum -c SHA256SUMS.txt && unzip -tq inftab-v2.0.0-extension.zip && unzip -tq inftab-v2.0.0-web.zip)
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          gh release edit v2.0.0 --draft=false
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v2.0.0" --jq .object.sha)" = "$GITHUB_SHA"
