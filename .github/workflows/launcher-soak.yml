name: Launcher sustained validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/HomeDock.vue'
      - 'src/components/ShortcutGrid.vue'
      - 'src/composables/useHomeNavigation.ts'
      - 'e2e/launcher-soak.spec.ts'
      - '.github/workflows/launcher-soak.yml'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Sustained input seconds'
        type: choice
        options: ['120', '600']
        default: '600'
permissions:
  contents: read
concurrency:
  group: launcher-soak-${{ github.ref }}
  cancel-in-progress: true
jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      INFTAB_SOAK_SECONDS: ${{ inputs.duration || '120' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- e2e/launcher-soak.spec.ts --workers=1 --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launcher-soak-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
